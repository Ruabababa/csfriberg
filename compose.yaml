services:
  siegeguess:
    build:
      context: .
      args:
        VITE_MULTIPLAYER_ENABLED: ${VITE_MULTIPLAYER_ENABLED:-false}
        RESOURCE_VERSION: ${RESOURCE_VERSION:-}
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
